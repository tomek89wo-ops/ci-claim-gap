name: tests

# This project reports repositories that build on a platform without testing on
# it, and test lanes filtered so coverage only grows when someone remembers a
# tag. It would be a poor advertisement for either check to skip a platform or
# filter its own suite, so this workflow runs every test on every platform.
#
# Point the tool at this repository and it should find nothing. That is the
# intended result and worth re-checking whenever this file changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # No -k, no -m, no --test-name-pattern. The whole suite, everywhere.
      - name: Run tests
        run: python -m pytest -q

  self-check:
    # The tool must come back clean on its own repository.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan this repository for CI claim gaps
        run: python ci_claim_gap.py ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Scan this repository's own tests for wiring-only assertions
        run: python mock_only_tests.py test_ci_claim_gap.py test_mock_only_tests.py
